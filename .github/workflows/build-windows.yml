name: Build (Windows)

# 手动触发：只构建并把产物上传成 artifact，不创建 Release。
# 想发布正式版请用 release.yml（打 tag 或手动填版本号）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '产物命名用的版本号（留空则读取 csproj）'
        required: false
        default: ''
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  build:
    name: 构建
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 解析版本号
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ($env:INPUT_VERSION ?? '').Trim()
          if (-not $version) {
              $version = ([xml](Get-Content NTEServerSwitch.csproj -Raw)).Project.PropertyGroup.Version.Trim()
          }
          if ($version -notmatch '^[0-9]+(\.[0-9]+)+$') {
              Write-Host "::error::版本号格式不对：$version"
              exit 1
          }
          $sha = (git rev-parse --short HEAD).Trim()
          Write-Host "版本 $version，提交 $sha"
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: 编译检查（不发布）
        shell: pwsh
        run: |
          dotnet build NTEServerSwitch.csproj -c Release -v minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 构建两个发布包
        shell: pwsh
        run: ./publish.ps1

      - name: 校验构建产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
              'dist/NTEServerSwitch_self-contained.zip',
              'dist/NTEServerSwitch_need-runtime.zip'
          )
          foreach ($file in $expected) {
              if (-not (Test-Path $file)) {
                  Write-Host "::error::缺少构建产物：$file"
                  exit 1
              }
          }
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
              Write-Host ('{0}  {1:N1} MB' -f $_.Name, ($_.Length / 1MB))
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NTEServerSwitch-v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}
          path: |
            dist/NTEServerSwitch_self-contained.zip
            dist/NTEServerSwitch_need-runtime.zip
          retention-days: 14
